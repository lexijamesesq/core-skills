name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
  schedule:
    # Catches gitleaks-common.sh drifting out from under this repo's one
    # remaining duplicate (narrowed by LEX-722; the skills/agent/hooks/
    # statusline duplicates it used to also catch are gone along with
    # dotty's copies) even between pushes here.
    - cron: '17 13 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI 2.1.259
        run: npm install -g @anthropic-ai/claude-code@2.1.259

      - name: claude plugin validate --strict
        run: claude plugin validate --strict .

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install uv 0.11.22
        run: pip install uv==0.11.22

      - name: house-qa test suite (35 tests)
        run: python3 plugins/work-lifecycle/skills/house-qa/tests/run_tests.py
      - name: linear scripts pytest suite (235 tests)
        working-directory: plugins/work-lifecycle/skills/linear/scripts
        run: uvx pytest@9.1.1 tests

      # gh-pr-body-guard.test.sh hard-requires the real gitleaks binary on
      # PATH (a pre-flight existence check + isolated fixture copies) —
      # same composite dotty's own CI uses, pinned to a commit on dotty's
      # main so it can't be repointed to an unreviewed branch tip.
      - name: Setup gitleaks
        uses: lexijamesesq/dotty/.github/actions/setup-gitleaks@d6552a4ddd2cd6411e0e971df1a6de47628d6f46
        with:
          version: '8.30.1'

      - name: estate-hooks test suites (202 tests)
        working-directory: plugins/estate-hooks/tests
        run: |
          set -euo pipefail
          for f in *.test.sh; do
            echo "::group::$f"
            bash "$f"
            echo "::endgroup::"
          done

  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: work-lifecycle
      - name: Checkout dotty main (current HEAD, re-resolved every run)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lexijamesesq/dotty
          ref: main
          path: dotty
      - name: Run drift check
        run: bash work-lifecycle/.github/scripts/drift-check.sh dotty work-lifecycle

  standalone-check:
    # Deliberately does NOT check dotty out — identity (drift-check, above)
    # and portability (this job) are different questions; this one only
    # proves the packaged copies work with dotty simply absent from the
    # runner, the same way an installed plugin cache is absent it on any
    # real machine.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: work-lifecycle
      # gh-pr-body-guard.sh's fixed-path check invokes the real gitleaks
      # binary — same composite dotty's own CI and this repo's
      # validate-and-test job use.
      - name: Setup gitleaks
        uses: lexijamesesq/dotty/.github/actions/setup-gitleaks@d6552a4ddd2cd6411e0e971df1a6de47628d6f46
        with:
          version: '8.30.1'
      - name: Run standalone check
        run: bash work-lifecycle/.github/scripts/standalone-check.sh work-lifecycle
