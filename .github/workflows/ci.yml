name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
  schedule:
    # Catches gitleaks-common.sh drifting out from under this repo's one
    # remaining duplicate (narrowed once dotty's own copies were retired; the skills/agent/hooks/
    # statusline duplicates it used to also catch are gone along with
    # dotty's copies) even between pushes here.
    - cron: '17 13 * * *'

permissions:
  contents: read

concurrency:
  # A push-to-main run must never be cancelled or replaced while pending —
  # GitHub's default queue holds one pending run per group and *replaces*
  # it, which would silently drop a version-bump's release run in favor of
  # a later no-bump push. Keying on github.sha for non-PR events gives
  # every commit its own group slot;
  # cancel-in-progress stays true only for PR events, which still want
  # superseding pushes to cancel the stale run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  floor:
    # The required check is `ci / checks`: this job's name, then the called
    # job's (estate-ci.yml's check_name). Convention `<lane> / <what it checks>`.
    name: ci
    # Read scopes the floor uses with github.token (Jev's triage answer on the
    # head's check-runs). A called workflow gets no more than this; on a
    # private repo the triage read 403s without it and the PR runs the full
    # suite. No write scope, no secret: this is the lane a PR controls.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1
    with:
      dotty_ref: v1
      check_name: checks

  all-checks-passed:
    name: ci / all-passed
    needs: [floor, validate-and-test, drift-check, standalone-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to have succeeded (a job skipped on a mechanical PR is satisfied)
        env:
          RESULTS: ${{ toJSON(needs) }}
          MECHANICAL: ${{ needs.floor.outputs.mechanical }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A skipped job is satisfied on a mechanical PR (the floor skipped
          # it) and on any non-PR event (a push to the default branch, where
          # any job skipped by its own `if:` is not a PR's failure); on a
          # functional PR a skipped job is a failure.
          bad="$(jq -r --arg mech "$MECHANICAL" --arg event "$EVENT" '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled"
                     or (.value.result == "skipped" and $mech != "true" and $event == "pull_request"))
            | .key' <<<"$RESULTS")"
          if [[ -n "$bad" ]]; then
            echo "required job(s) not satisfied: $bad"
            exit 1
          fi
          echo "all checks passed (event=${EVENT} mechanical=${MECHANICAL:-false})"

  validate-and-test:
    name: ci / validate-and-test
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI 2.1.259
        run: npm install -g @anthropic-ai/claude-code@2.1.259

      - name: claude plugin validate --strict
        run: claude plugin validate --strict .

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv 0.11.22
        run: pip install uv==0.11.22

      - name: linear scripts pytest suite (235 tests)
        working-directory: plugins/core/skills/linear/scripts
        run: uvx pytest@9.1.1 tests

      # gh-pr-body-guard.test.sh hard-requires the real gitleaks binary on
      # PATH (a pre-flight existence check + isolated fixture copies) —
      # same composite dotty's own CI uses, pinned to a commit on dotty's
      # main so it can't be repointed to an unreviewed branch tip.
      - name: Setup gitleaks
        uses: lexijamesesq/dotty/.github/actions/setup-gitleaks@v1
        with:
          version: '8.30.1'

      - name: estate-hooks test suites (628 tests)
        working-directory: plugins/estate-hooks/tests
        run: |
          set -euo pipefail
          for f in *.test.sh; do
            echo "::group::$f"
            bash "$f"
            echo "::endgroup::"
          done

  drift-check:
    name: ci / drift-check
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: core-skills
      - name: Checkout dotty main (current HEAD, re-resolved every run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: main
          path: dotty
      - name: Run drift check
        run: bash core-skills/.github/scripts/drift-check.sh dotty core-skills

  standalone-check:
    name: ci / standalone-check
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    # Deliberately does NOT check dotty out — identity (drift-check, above)
    # and portability (this job) are different questions; this one only
    # proves the packaged copies work with dotty simply absent from the
    # runner, the same way an installed plugin cache is absent it on any
    # real machine.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: core-skills
      # gh-pr-body-guard.sh's fixed-path check invokes the real gitleaks
      # binary — same composite dotty's own CI and this repo's
      # validate-and-test job use.
      - name: Setup gitleaks
        uses: lexijamesesq/dotty/.github/actions/setup-gitleaks@v1
        with:
          version: '8.30.1'
      - name: Run standalone check
        run: bash core-skills/.github/scripts/standalone-check.sh core-skills

  release-check:
    name: ci / release-check
    # floor: always-run
    # release-check refuses a plugin change without a version bump;
    # a mechanical PR (a Renovate bump inside a plugin) can still need one.
    # PR-time check, no writes. Required by this repo's
    # branch-protection ruleset (added alongside this job, strict), so a
    # merge that changes a plugin's content without bumping its version is
    # blocked, not just reported red after the fact. Deliberately no
    # `paths:` filter on the workflow — a path-skipped required check
    # stays "Pending" forever and blocks every other PR (GitHub docs).
    # Runs on every PR; the job itself is cheap when nothing changed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check plugin version discipline
        run: |
          set -uo pipefail
          FAILED=0
          bash .github/scripts/check-plugin-version.sh plugins/core core || FAILED=1
          bash .github/scripts/check-plugin-version.sh plugins/estate-hooks estate-hooks || FAILED=1
          exit "$FAILED"

  release-tag:
    name: ci / release-tag
    # Push-time, main only. Cuts a tag + GitHub Release for any
    # plugin whose declared version isn't tagged yet. Idempotent (safe to
    # re-run; see tag-plugin-release.sh). contents: write scoped to this
    # job only — every other job in this workflow stays contents: read.
    if: ${{ (github.event_name == 'push') && needs.floor.outputs.mechanical != 'true' }}
    needs: [floor, validate-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # claude plugin tag creates an annotated tag (-m), which needs a
      # committer identity; a fresh runner checkout has none configured.
      # Standard github-actions[bot] identity, same as GitHub's own
      # first-party actions use for automated commits/tags.
      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI 2.1.259
        run: npm install -g @anthropic-ai/claude-code@2.1.259

      - name: Tag and release changed plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          FAILED=0
          bash .github/scripts/tag-plugin-release.sh plugins/core core || FAILED=1
          bash .github/scripts/tag-plugin-release.sh plugins/estate-hooks estate-hooks || FAILED=1
          exit "$FAILED"
